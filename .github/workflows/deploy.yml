# Builds the site and deploys it to Cloudflare Pages (project "omabox"): on every push to main, once a
# day (so new omabox contributors show up), and by hand from the Actions tab.
#
# The repo variable SITE_URL is https://omabox.app since launch (2026-09-29); the last step keeps the
# domain attached. Without it the build targets omabox.pages.dev with noindex.

name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 433e2ce2a5dce0c5eae78569eccd4122
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT: omabox

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: node build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL || 'https://omabox.pages.dev' }}

      - name: Create the Pages project if it doesn't exist
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" ||
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

      # Once SITE_URL is omabox.app: attach omabox.app and www.omabox.app to the project and point their
      # DNS at it (www only redirects, in functions/_middleware.js). All no-ops when already done.
      - name: Attach omabox.app and www.omabox.app
        if: vars.SITE_URL == 'https://omabox.app'
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          A=https://api.cloudflare.com/client/v4
          zone=$(api "$A/zones?name=omabox.app" | jq -r '.result[0].id // empty')
          for d in omabox.app www.omabox.app; do
            echo "== $d"
            api -X POST "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" -d "{\"name\":\"$d\"}" |
              jq -c '{success, errors: [.errors[]?.message], status: .result.status}'
            if [ -z "$zone" ]; then echo "::warning::can't read the omabox.app zone: add a proxied CNAME $d -> $PROJECT.pages.dev by hand"; continue; fi
            if [ "$(api "$A/zones/$zone/dns_records?name=$d" | jq '.result | length')" = 0 ]; then
              api -X POST "$A/zones/$zone/dns_records" -d "{\"type\":\"CNAME\",\"name\":\"$d\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" |
                jq -c '{success, errors: [.errors[]?.message]}'
            else
              api "$A/zones/$zone/dns_records?name=$d" | jq -c '.result[] | {type, content, proxied}'
            fi
          done
          sleep 20
          for d in omabox.app www.omabox.app; do api "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$d" | jq -c "{domain: \"$d\", status: .result.status}"; done

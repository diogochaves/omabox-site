<!doctype html>
<html>
  <body>
    <template>
      <style>
        #a7-root { position: absolute; inset: 0; background: #000; }
        #a7-set { position: absolute; inset: 0; transform-origin: 50% 50%; background: radial-gradient(ellipse at 50% 35%, var(--lift) 0%, var(--ground) 70%); }
        /* The guarantee: a gold seal and the site's three zeros. */
        #a7-seal { left: calc(80 * var(--u)); top: calc(70 * var(--u)); width: calc(330 * var(--u)); height: calc(330 * var(--u)); }
        #a7-seal .t { font-size: calc(54 * var(--u)); color: #2a1f00; }
        #a7-seal .t small { display: block; font-size: calc(28 * var(--u)); margin-top: calc(6 * var(--u)); }
        #a7-g { position: absolute; left: calc(470 * var(--u)); top: calc(110 * var(--u)); font-size: calc(110 * var(--u)); }
        .z { position: absolute; top: calc(470 * var(--u)); width: calc(560 * var(--u)); height: calc(300 * var(--u)); border-radius: calc(20 * var(--u));
          background: var(--lift); box-shadow: 0 0 0 2px var(--edge); padding: calc(30 * var(--u)) calc(36 * var(--u)); }
        .z .n0 { font-size: calc(120 * var(--u)); color: var(--good); line-height: 1; }
        .z .n { font-size: calc(28 * var(--u)); letter-spacing: 0.12em; color: var(--ink); margin-top: calc(10 * var(--u)); }
        .z .w { font-family: Montserrat, sans-serif; font-weight: 800; font-size: calc(30 * var(--u)); color: var(--muted); margin-top: calc(16 * var(--u)); line-height: 1.3; }
        /* Order now. */
        #a7-call { position: absolute; left: 0; right: 0; top: calc(70 * var(--u)); text-align: center; font-size: calc(120 * var(--u)); }
        #a7-lock { position: absolute; left: 0; right: 0; top: calc(290 * var(--u)); height: calc(150 * var(--u));
          display: flex; align-items: center; justify-content: center; gap: calc(40 * var(--u)); }
        #a7-mark { position: relative; width: calc(140 * var(--u)); height: calc(140 * var(--u)); }
        #a7-word { font-size: calc(150 * var(--u)); }
        #a7-url { position: absolute; left: 0; right: 0; top: calc(500 * var(--u)); text-align: center; font-size: calc(110 * var(--u)); color: var(--accent); }
        #a7-today { position: absolute; left: 0; right: 0; top: calc(680 * var(--u)); text-align: center; font-size: calc(80 * var(--u)); }
        #a7-fine { position: absolute; left: 0; bottom: calc(40 * var(--u)); white-space: nowrap; font-family: "JetBrains Mono", monospace; font-weight: 700;
          font-size: calc(26 * var(--u)); color: var(--muted); }
        #a7-dot { position: absolute; left: calc(950 * var(--u)); top: calc(530 * var(--u)); width: calc(20 * var(--u)); height: calc(20 * var(--u)); border-radius: 50%; background: #fff; opacity: 0;
          box-shadow: 0 0 calc(30 * var(--u)) #fff; }
      </style>
      <!-- Act 7: Order now! The guarantee (omabox.app's hero zeros), then the call to action with the
           fine print crawling under it; the set switches off. -->
      <div id="a7-root" data-composition-id="a7" data-width="1920" data-height="1080">
        <div id="a7-set">
          <div id="a7-a">
            <div id="a7-seal" class="burst"><div class="t">100%<small>GUARANTEED*</small></div></div>
            <div id="a7-g" class="cap">Guaranteed, every time:</div>
            <div class="z" style="left: calc(80 * var(--u))"><div class="n0 display">0</div><div class="n mono">WINDOWS OPENED</div>
              <div class="w">No windows popping up, no cursor jumps</div></div>
            <div class="z" style="left: calc(680 * var(--u))"><div class="n0 display">0</div><div class="n mono">FOCUS TAKEN</div>
              <div class="w">No stolen focus, no password prompts</div></div>
            <div class="z" style="left: calc(1280 * var(--u))"><div class="n0 display">0</div><div class="n mono">LEFT BEHIND</div>
              <div class="w">Nothing left behind when the agent is done</div></div>
          </div>
          <div id="a7-b">
            <div id="a7-call" class="cap">Don't call. Ask your agent!</div>
            <div id="a7-lock"><div id="a7-mark" class="mark"></div><div id="a7-word" class="wordmark">omabox</div></div>
            <div id="a7-url" class="mono">omabox.app</div>
            <div id="a7-today" class="cap w">Free · MIT · Start today!</div>
          </div>
          <div id="a7-fine" data-layout-allow-overflow>*Box included. Desktop not included: you already have one, and now you get to keep it. · Today on Omarchy 4 · Hyprland 0.56+ · AMD, Intel or NVIDIA. Plain Hyprland is coming. · Every shot filmed in omabox. · No desktops were harmed in the making of this video.</div>
        </div>
        <div id="a7-dot"></div>
      </div>
      <script>
        const px = omaboxMark.draw(document.getElementById("a7-mark"), 140 / 15);
        info.burst(document.getElementById("a7-seal"), "#f2b705", 30, 0.88, "#7a5c00");
        const tl = gsap.timeline({ paused: true });
        // The guarantee.
        tl.fromTo("#a7-seal", { opacity: 0, scale: 0, rotation: -180 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 0.05);
        tl.to("#a7-seal", { rotation: 20, duration: 3, ease: "sine.inOut" }, 0.5);
        tl.fromTo("#a7-g", { opacity: 0, scale: 1.4, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)" }, 0.3);
        tl.fromTo(".z", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.35 }, 0.7);
        tl.fromTo(".z .n0", { scale: 1.6, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.35, ease: "back.out(2.5)", stagger: 0.35 }, 0.8);
        tl.to("#a7-a", { opacity: 0, duration: 0.2 }, 3.4);
        // Order now.
        tl.set("#a7-b", { opacity: 0 }, 0);
        tl.set("#a7-b", { opacity: 1 }, 3.6);
        tl.fromTo("#a7-call", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)" }, 3.65);
        tl.fromTo(px, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.4)", stagger: 0.025 }, 3.9);
        tl.fromTo("#a7-word", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 4.05);
        tl.fromTo("#a7-url", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.4);
        tl.to("#a7-url", { color: "#ffd60a", duration: 0.01, yoyo: true, repeat: 7, repeatDelay: 0.3, ease: "none" }, 4.9);
        tl.fromTo("#a7-today", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)" }, 4.9);
        // The fine print, crawling.
        tl.fromTo("#a7-fine", { x: 1920 }, { x: -2700, duration: 8.6, ease: "none" }, 0.3);
        // The set switches off: down to a line, then a dot.
        tl.to("#a7-set", { scaleY: 0.004, filter: "brightness(4)", duration: 0.18, ease: "power3.in" }, 8.9);
        tl.to("#a7-set", { scaleX: 0, duration: 0.15, ease: "power3.in" }, 9.08);
        tl.fromTo("#a7-dot", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.05 }, 9.15);
        tl.to("#a7-dot", { opacity: 0, scale: 0.2, duration: 0.3, ease: "power2.in" }, 9.2);
        window.__timelines["a7"] = tl;
      </script>
    </template>
  </body>
</html>

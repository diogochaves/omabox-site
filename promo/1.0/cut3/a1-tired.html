<!doctype html>
<html>
  <body>
    <template>
      <style>
        #a1-root { position: absolute; inset: 0; background: #000; }
        /* The old TV: rounded glass, black and white, scanlines, grain, a rolling band, a vignette. */
        #a1-crt { position: absolute; inset: calc(10 * var(--u)); border-radius: calc(46 * var(--u)); overflow: hidden; background: #111; }
        #a1-tv { position: absolute; left: 0; top: 0; width: 1900px; height: 1060px; overflow: hidden; filter: grayscale(1) contrast(1.35) brightness(0.92) blur(0.6px); }
        .a1-fx { position: absolute; inset: 0; pointer-events: none; }
        #a1-scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.32) 3px, rgba(0,0,0,0.32) 4px); }
        #a1-grain { opacity: 0.12; mix-blend-mode: screen; background-size: 384px 384px; }
        #a1-roll { height: calc(220 * var(--u)); inset: auto 0 auto 0; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.07), rgba(255,255,255,0)); }
        #a1-vig { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
        #a1-static { opacity: 0; background-size: 192px 192px; }
        #a1-on { background: #fff; transform-origin: 50% 50%; }
        /* Omarchy's password prompt, drawn (a box has no system bus, so it cannot be filmed). */
        #a1-pk { position: absolute; left: calc(610 * var(--u)); top: calc(300 * var(--u)); width: calc(700 * var(--u)); padding: calc(34 * var(--u)) calc(40 * var(--u));
          border-radius: calc(14 * var(--u)); background: #1a1b26; box-shadow: 0 0 0 2px #7aa2f7, 0 calc(30 * var(--u)) calc(80 * var(--u)) rgba(0,0,0,0.7);
          color: #c0caf5; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(26 * var(--u)); opacity: 0; }
        #a1-pk .t { font-size: calc(34 * var(--u)); margin-bottom: calc(16 * var(--u)); }
        #a1-pk .f { margin: calc(22 * var(--u)) 0; padding: calc(14 * var(--u)) calc(18 * var(--u)); border-radius: calc(8 * var(--u)); box-shadow: 0 0 0 2px #7aa2f7; }
        #a1-pk .m { color: #a9b1d6; }
        .a1-cap { position: absolute; left: 0; right: 0; bottom: calc(90 * var(--u)); text-align: center; font-size: calc(124 * var(--u)); opacity: 0; }
        #a1-ring { position: absolute; left: calc(420 * var(--u)); top: calc(415 * var(--u)); width: calc(460 * var(--u)); height: calc(140 * var(--u)); overflow: visible; }
      </style>
      <!-- Act 1: Are you tired of... (B&W, an old TV). The real desk-problem take: omaseed's window
           lands on your desktop and takes your sentence; then a drawn password prompt; then the plea. -->
      <div id="a1-root" data-composition-id="a1" data-width="1920" data-height="1080">
        <div id="a1-crt">
          <div id="a1-tv">
            <div id="a1-full" class="full"><div id="a1-z" class="zoom" data-layout-allow-overflow>
              <!-- desk-problem: pop at 6.22 s, stolen 6.65 s; in at 5.62 s puts the pop at 0.6 s. -->
              <video id="a1-v" src="assets/footage/desk-problem.mp4" muted
                     data-start="0" data-duration="7.5" data-media-start="5.62" data-track-index="0"></video>
            </div></div>
            <div id="a1-pk"><div class="t">Authentication required</div>
              <div class="m">to run /usr/bin/make as the super user</div>
              <div class="f">Password: ▍</div>
              <div class="m">Cancel · Authenticate</div></div>
          </div>
          <div id="a1-scan" class="a1-fx"></div>
          <div id="a1-grain" class="a1-fx"></div>
          <div id="a1-roll" class="a1-fx"></div>
          <div id="a1-vig" class="a1-fx"></div>
          <svg id="a1-ring" viewBox="0 0 460 140" data-layout-allow-overflow><ellipse id="a1-el" cx="230" cy="70" rx="215" ry="58" fill="none" stroke="#e5243b" stroke-width="9" stroke-linecap="round"/></svg>
          <div id="a1-static" class="a1-fx"></div>
          <div id="a1-on" class="a1-fx"></div>
        </div>
        <div id="a1-c1" class="a1-cap cap">Are you tired of THIS?!</div>
        <div id="a1-c2" class="a1-cap cap">Your sentence… in <span class="w">ITS</span> app?!</div>
        <div id="a1-c3" class="a1-cap cap" style="font-size: calc(108 * var(--u))">Password prompts out of nowhere?!</div>
        <div id="a1-c4" class="a1-cap cap">There's GOT to be a better way!</div>
      </div>
      <script>
        const FRAME = { srcW: 3840, srcH: 2160, cardW: 1920, cardH: 1080 };
        const aim = (s, sx, sy) => director.aim(s, sx, sy, FRAME);
        document.getElementById("a1-grain").style.backgroundImage = `url(${info.noise(128, 7)})`;
        document.getElementById("a1-static").style.backgroundImage = `url(${info.noise(192, 11)})`;
        const el = document.getElementById("a1-el"), L = el.getTotalLength ? el.getTotalLength() : 1400;
        const tl = gsap.timeline({ paused: true });
        // The set switches on: a white line opening to the picture.
        tl.fromTo("#a1-on", { scaleY: 0.004, opacity: 1 }, { scaleY: 1, duration: 0.14, ease: "power2.out" }, 0);
        tl.to("#a1-on", { opacity: 0, duration: 0.22, ease: "power2.out" }, 0.14);
        // Old-TV life all through: grain in steps, a band rolling down, a little jitter.
        tl.fromTo("#a1-grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "1913px 1187px", duration: 7.5, ease: "steps(60)" }, 0);
        tl.fromTo("#a1-roll", { y: -240 }, { y: 1100, duration: 2.6, ease: "none", repeat: 2 }, 0);
        tl.fromTo("#a1-tv", { y: 0 }, { y: 2, duration: 0.07, ease: "steps(1)", yoyo: true, repeat: 105 }, 0);
        // 1. The window lands: a crash zoom and a shake. ARE YOU TIRED OF THIS?!
        tl.set("#a1-z", aim(1, 1920, 1080), 0);
        tl.to("#a1-z", { ...aim(1.22, 2100, 1000), duration: 0.18, ease: "power4.out" }, 0.6);
        tl.fromTo("#a1-full", { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, 0.6);
        tl.fromTo("#a1-c1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 0.65);
        tl.to("#a1-c1", { opacity: 0, duration: 0.1 }, 2.15);
        // 2. Your sentence in its field, circled in red.
        tl.to("#a1-z", { ...aim(1.75, 1920, 760), duration: 0.35, ease: "power3.inOut" }, 2.2);
        tl.fromTo("#a1-c2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 2.3);
        tl.set("#a1-ring", { opacity: 0 }, 0);
        tl.set("#a1-ring", { opacity: 1 }, 2.8);
        tl.fromTo(el, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 2.8);
        tl.to(["#a1-c2", "#a1-ring"], { opacity: 0, duration: 0.1 }, 4.25);
        // 3. A password prompt nobody asked for.
        tl.to("#a1-z", { ...aim(1, 1920, 1080), duration: 0.3, ease: "power3.inOut" }, 4.3);
        tl.fromTo("#a1-pk", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 4.45);
        tl.fromTo("#a1-c3", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 4.5);
        tl.to("#a1-c3", { opacity: 0, duration: 0.1 }, 5.95);
        // 4. The plea: the picture rolls and shakes; then static, a channel change.
        tl.fromTo("#a1-c4", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 6.0);
        tl.fromTo("#a1-full", { y: 0 }, { y: -1080, duration: 0.5, ease: "none", repeat: 1 }, 6.3);
        tl.fromTo("#a1-crt", { rotation: 0 }, { rotation: 0.6, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, 6.2);
        tl.fromTo("#a1-static", { opacity: 0 }, { opacity: 1, duration: 0.06 }, 7.2);
        tl.fromTo("#a1-static", { backgroundPosition: "0px 0px" }, { backgroundPosition: "700px 333px", duration: 0.3, ease: "steps(9)" }, 7.2);
        window.__timelines["a1"] = tl;
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; }
        #s3-say1 { bottom: calc(70 * var(--u)); font-size: calc(64 * var(--u)); }
        #s3-say2 { top: calc(735 * var(--u)); font-size: calc(72 * var(--u)); }
        #s3-say2 .ok { color: var(--good); }
        .bx { position: absolute; width: calc(420 * var(--u)); height: calc(236 * var(--u)); overflow: hidden;
          border-radius: calc(14 * var(--u)); box-shadow: 0 calc(20 * var(--u)) calc(50 * var(--u)) rgba(0,0,0,0.5), 0 0 0 2px var(--edge); }
        .bx .chip { left: calc(10 * var(--u)); bottom: calc(10 * var(--u)); font-size: calc(24 * var(--u)); color: var(--accent); letter-spacing: 0.02em; }
        #s3-desk { border-radius: 0; }
      </style>
      <!-- Frame 4: the same desktop, the same sentence, typed straight through; the agent works in
           a box. Then the desktop steps aside and the four agents' boxes come in, then their list. -->
      <div id="s3-root" data-composition-id="s3" data-width="1920" data-height="1080">
        <div id="s3-desk" class="full"><div id="s3-z" class="zoom" data-layout-allow-overflow>
          <!-- desk-boxed: typing from 3.06 s; the agent's ls at 17.64 s, done 20.58 s. Two pieces, cut
               where the desktop shrinks. -->
          <video id="s3-va" src="assets/footage/desk-boxed.mp4" muted
                 data-start="0" data-duration="4.7" data-media-start="3.0" data-track-index="0"></video>
          <video id="s3-vb" src="assets/footage/desk-boxed.mp4" muted
                 data-start="4.7" data-duration="6.0" data-media-start="14.44" data-track-index="1"></video>
        </div></div>
        <div id="s3-band" class="band"></div>
        <div id="s3-chip" class="chip mono" style="right: calc(40 * var(--u)); top: calc(70 * var(--u)); color: var(--good)">YOUR DESKTOP</div>
        <div id="s3-chip2" class="chip mono" style="left: calc(70 * var(--u)); top: calc(600 * var(--u)); font-size: calc(24 * var(--u)); color: var(--good)">YOUR DESKTOP</div>
        <div id="s3-say1" class="pad display">Now the agent tests in a box of its own.</div>

        <div id="s3-b1" class="bx" style="left: calc(990 * var(--u)); top: calc(150 * var(--u))">
          <video id="s3-v1" src="assets/footage/box-omaseed-5cc72cdc.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="6.0" data-media-start="6.0" data-track-index="2"></video>
          <div class="chip mono">omaseed-5cc72cdc</div></div>
        <div id="s3-b2" class="bx" style="left: calc(1430 * var(--u)); top: calc(150 * var(--u))">
          <video id="s3-v2" src="assets/footage/box-add-sheet-9f01d2e4.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="6.0" data-media-start="7.0" data-track-index="3"></video>
          <div class="chip mono">add-sheet-9f01d2e4</div></div>
        <div id="s3-b3" class="bx" style="left: calc(990 * var(--u)); top: calc(406 * var(--u))">
          <video id="s3-v3" src="assets/footage/box-themes-7d20e815.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="6.0" data-media-start="8.0" data-track-index="4"></video>
          <div class="chip mono">themes-7d20e815</div></div>
        <div id="s3-b4" class="bx" style="left: calc(1430 * var(--u)); top: calc(406 * var(--u))">
          <video id="s3-v4" src="assets/footage/box-tray-icon-3b7a6c11.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="6.0" data-media-start="7.0" data-track-index="5"></video>
          <div class="chip mono">tray-icon-3b7a6c11</div></div>

        <div id="s3-say2" class="pad display">
          <div>Four agents, four boxes.</div>
          <div class="ok">Nothing moves on yours.</div>
        </div>
      </div>
      <script>
        // The desk take is 3840x2160 in a 1920x1080 frame, then scaled to 900x506 at (60, 150).
        const FRAME = { srcW: 3840, srcH: 2160, cardW: 1920, cardH: 1080 };
        const aim = (s, sx, sy) => director.aim(s, sx, sy, FRAME);
        const tl = gsap.timeline({ paused: true });
        // A match cut: the same desktop as frame 1, the same label in the same place.
        tl.set("#s3-z", aim(1.06, 1100, 500), 0);
        tl.fromTo("#s3-desk", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
        tl.to("#s3-z", { ...aim(1, 1920, 1080), duration: 4.4, ease: "sine.inOut" }, 0.1);
        tl.fromTo("#s3-chip", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
        tl.fromTo("#s3-band", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
        tl.fromTo("#s3-say1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.5);
        // The desktop steps aside; the four boxes fan in.
        tl.to(["#s3-say1", "#s3-band"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.3);
        tl.to("#s3-desk", { scale: 900 / 1920, x: 60, y: 150, borderRadius: 14, duration: 0.6, ease: "power3.inOut",
          boxShadow: "0 0 0 2px #292e42" }, 4.5);
        tl.to("#s3-chip", { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.4);
        tl.fromTo("#s3-chip2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.0);
        tl.fromTo(["#s3-b1", "#s3-b2", "#s3-b3", "#s3-b4"], { opacity: 0, x: 140, rotation: 4 },
          { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 4.8);
        tl.fromTo("#s3-say2 > div", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.5 }, 5.4);
        // The agent's list: its box and the other three (ls at 17.64 s in the take = 7.9 s here).
        tl.to("#s3-z", { ...aim(1.9, 2750, 760), duration: 0.6, ease: "power3.inOut" }, 7.9);
        tl.to("#s3-root", { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.4);
        window.__timelines["s3"] = tl;
      </script>
    </template>
  </body>
</html>

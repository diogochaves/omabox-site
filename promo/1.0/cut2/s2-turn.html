<!doctype html>
<html>
  <body>
    <template>
      <style>
        #s2-root { position: absolute; inset: 0; }
        #s2-lock { position: absolute; left: 0; right: 0; top: calc(270 * var(--u)); height: calc(165 * var(--u));
          display: flex; align-items: center; justify-content: center; gap: calc(44 * var(--u)); }
        #s2-mark { position: relative; width: calc(165 * var(--u)); height: calc(165 * var(--u)); }
        #s2-word { font-size: calc(180 * var(--u)); }
        #s2-pitch { position: absolute; left: 0; right: 0; top: calc(560 * var(--u)); text-align: center; font-size: calc(76 * var(--u)); }
        #s2-p2 { color: var(--good); margin-top: calc(10 * var(--u)); }
      </style>
      <!-- Frame 3: the turn. The mark assembles, the name lands, then the pitch, line by line. -->
      <div id="s2-root" data-composition-id="s2" data-width="1920" data-height="1080">
        <div id="s2-lock">
          <div id="s2-mark" class="mark"></div>
          <div id="s2-word" class="wordmark">omabox</div>
        </div>
        <div id="s2-pitch" class="display">
          <div id="s2-p1">Your agents get desktops of their own.</div>
          <div id="s2-p2">Yours stays untouched.</div>
        </div>
      </div>
      <script>
        const px = omaboxMark.draw(document.getElementById("s2-mark"), 11);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(px, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.4)", stagger: 0.04 }, 0.05);
        tl.fromTo("#s2-word", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.35);
        tl.fromTo("#s2-p1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.8);
        tl.fromTo("#s2-p2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.6);
        tl.to("#s2-root", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.0);
        window.__timelines["s2"] = tl;
      </script>
    </template>
  </body>
</html>

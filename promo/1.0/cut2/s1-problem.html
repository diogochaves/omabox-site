<!doctype html>
<html>
  <body>
    <template>
      <style>
        #s1-root { position: absolute; inset: 0; background: var(--ground); }
        #s1-say { bottom: calc(70 * var(--u)); font-size: calc(76 * var(--u)); }
        #s1-say .hot { color: var(--warn); }
      </style>
      <!-- Frames 1-2: your desktop (a stage box). You type; the agent starts omaseed on the same
           desktop; its window takes your keys: "add a speed graph" opens its Add torrent sheet and
           the rest lands in the field. The window pops at 1.5 s. -->
      <div id="s1-root" data-composition-id="s1" data-width="1920" data-height="1080">
        <div id="s1-full" class="full"><div id="s1-z" class="zoom" data-layout-allow-overflow>
          <!-- desk-problem: pop at 6.22 s, stolen at 6.65 s; in at 4.72 s puts the pop at 1.5 s. -->
          <video id="s1-v" src="assets/footage/desk-problem.mp4" muted
                 data-start="0" data-duration="6.5" data-media-start="4.72" data-track-index="0"></video>
        </div></div>
        <div id="s1-band" class="band"></div>
        <div id="s1-chip" class="chip mono" style="right: calc(40 * var(--u)); top: calc(70 * var(--u)); color: var(--warn)">YOUR DESKTOP</div>
        <div id="s1-say" class="pad display">
          <div id="s1-l1">Your agent is testing its app.</div>
          <div id="s1-l2" class="hot">On your desktop.</div>
        </div>
      </div>
      <script>
        // The take is 3840x2160 shown full frame (1920x1080). The Add torrent field is at about
        // (1920, 700) in the take.
        const FRAME = { srcW: 3840, srcH: 2160, cardW: 1920, cardH: 1080 };
        const aim = (s, sx, sy) => director.aim(s, sx, sy, FRAME);
        const tl = gsap.timeline({ paused: true });
        tl.set("#s1-z", aim(1, 1920, 1080), 0);
        tl.to("#s1-z", { ...aim(1.06, 1100, 500), duration: 1.5, ease: "sine.inOut" }, 0);       // a slow push toward the editor
        tl.fromTo("#s1-chip", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#s1-band", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);
        tl.fromTo("#s1-l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
        // The pop: a jolt on the frame as the window lands.
        tl.fromTo("#s1-full", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 1.5);
        tl.fromTo("#s1-l2", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.55);
        // What it costs: the camera goes to its field, where your words are landing.
        tl.to("#s1-z", { ...aim(1.75, 1920, 760), duration: 0.7, ease: "power3.inOut" }, 2.2);
        // Out: a whip to the left.
        tl.to("#s1-full", { x: -1920, filter: "blur(18px)", duration: 0.35, ease: "power3.in" }, 6.15);
        tl.to(["#s1-say", "#s1-band", "#s1-chip"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 6.15);
        window.__timelines["s1"] = tl;
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <body>
    <template>
      <style>
        #s6-root { position: absolute; inset: 0; }
        #s6-lock { position: absolute; left: calc(80 * var(--u)); top: calc(60 * var(--u)); height: calc(90 * var(--u)); display: flex; align-items: center; gap: calc(26 * var(--u)); }
        #s6-mark { position: relative; width: calc(90 * var(--u)); height: calc(90 * var(--u)); }
        #s6-word { font-size: calc(92 * var(--u)); }
        #s6-ver { font-size: calc(26 * var(--u)); color: var(--accent); letter-spacing: 0.14em; margin-left: calc(10 * var(--u)); padding-top: calc(30 * var(--u)); }
        #s6-h { top: calc(205 * var(--u)); font-size: calc(80 * var(--u)); }
        #s6-h2 { color: var(--good); }
        #s6-sub { top: calc(400 * var(--u)); font-family: Montserrat, sans-serif; font-weight: 800; font-size: calc(36 * var(--u)); line-height: 1.35; color: var(--muted); max-width: calc(1500 * var(--u)); }
        .tile { position: absolute; top: calc(535 * var(--u)); width: calc(560 * var(--u)); height: calc(280 * var(--u)); border-radius: calc(20 * var(--u));
          background: var(--lift); box-shadow: 0 0 0 2px var(--edge); padding: calc(28 * var(--u)) calc(34 * var(--u)); }
        .tile .z { font-size: calc(96 * var(--u)); color: var(--good); line-height: 1; }
        .tile .n { font-size: calc(26 * var(--u)); letter-spacing: 0.12em; color: var(--ink); margin-top: calc(8 * var(--u)); }
        .tile .w { font-family: Montserrat, sans-serif; font-weight: 800; font-size: calc(29 * var(--u)); color: var(--muted); margin-top: calc(16 * var(--u)); line-height: 1.3; }
        #s6-url { position: absolute; left: calc(80 * var(--u)); top: calc(860 * var(--u)); font-size: calc(76 * var(--u)); color: var(--accent); }
        #s6-free { position: absolute; right: calc(80 * var(--u)); top: calc(882 * var(--u)); font-size: calc(34 * var(--u)); color: var(--ink); letter-spacing: 0.06em; }
        #s6-where { position: absolute; left: calc(80 * var(--u)); top: calc(985 * var(--u)); font-size: calc(26 * var(--u)); color: var(--muted); letter-spacing: 0.04em; }
        #s6-where .g { color: var(--good); }
      </style>
      <!-- Frame 7: the close, as omabox.app's hero: the lockup, the pitch, what it does, what it
           keeps from happening, the address. No install line, no credits (they are in the thread). -->
      <div id="s6-root" data-composition-id="s6" data-width="1920" data-height="1080">
        <div id="s6-lock">
          <div id="s6-mark" class="mark"></div>
          <div id="s6-word" class="wordmark">omabox</div>
          <div id="s6-ver" class="mono">1.0</div>
        </div>
        <div id="s6-h" class="pad display">
          <div id="s6-h1">Your agents get desktops of their own.</div>
          <div id="s6-h2">Yours stays untouched.</div>
        </div>
        <div id="s6-sub" class="pad">omabox gives every coding agent a whole Hyprland desktop to test its work in: invisible, one per agent, gone when the agent is.</div>
        <div id="s6-t1" class="tile" style="left: calc(80 * var(--u))"><div class="z display">0</div><div class="n mono">WINDOWS OPENED</div>
          <div class="w">No windows popping up, no cursor jumps</div></div>
        <div id="s6-t2" class="tile" style="left: calc(680 * var(--u))"><div class="z display">0</div><div class="n mono">FOCUS TAKEN</div>
          <div class="w">No stolen focus, no password prompts</div></div>
        <div id="s6-t3" class="tile" style="left: calc(1280 * var(--u))"><div class="z display">0</div><div class="n mono">LEFT BEHIND</div>
          <div class="w">Nothing left behind when the agent is done</div></div>
        <div id="s6-url" class="mono">omabox.app</div>
        <div id="s6-free" class="mono">free · MIT, every line</div>
        <div id="s6-where" class="mono">Today on Omarchy 4 · Hyprland 0.56+ · AMD, Intel or NVIDIA · <span class="g">plain Hyprland is coming</span></div>
      </div>
      <script>
        const px = omaboxMark.draw(document.getElementById("s6-mark"), 6);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(px, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.4)", stagger: 0.025 }, 0.05);
        tl.fromTo(["#s6-word", "#s6-ver"], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", stagger: 0.1 }, 0.2);
        tl.fromTo("#s6-h1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.4);
        tl.fromTo("#s6-h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.9);
        tl.fromTo("#s6-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.5);
        tl.fromTo(["#s6-t1", "#s6-t2", "#s6-t3"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.35 }, 2.4);
        tl.fromTo(".tile .z", { scale: 1.5, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.35 }, 2.5);
        tl.fromTo("#s6-url", { opacity: 0, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 4.0);
        tl.fromTo(["#s6-free", "#s6-where"], { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.3 }, 4.4);
        window.__timelines["s6"] = tl;
      </script>
    </template>
  </body>
</html>

        <div id="b4-head" class="pad display">And it's how your agent tests what it builds:</div>

        <div id="b4-u3" class="b4-say display">…and on the next build, it names what moved, by the pixel.</div>
        <div id="b4-u4" class="b4-say display">It reads your app as text, too.</div>

        <div id="b4-c1" class="b4-card"><pre><span class="cm"># omaseed's scripts/dev/visual-check.sh (an excerpt)</span>
<span class="k">omabox</span> run -d --wait -- "$BUILD/omaseed"
<span class="k">omabox</span> <span class="g">check point</span> bar -g "0,0 1920x30"
<span class="k">omabox</span> <span class="g">check point</span> help --window "$APP" -g "$(sheet_region Shortcuts "$SHEET")"
<span class="k">omabox</span> <span class="g">check point</span> add --window "$APP" -g "$(sheet_region "Add torrent" "$ADD_SHEET")"
<span class="k">omabox</span> keys --window "$APP" --wait -t "sampler"
<span class="k">omabox</span> run -- omarchy-shell shell summon chaves.omaseed
<span class="k">omabox</span> <span class="g">check point</span> popup
<span class="k">omabox</span> keys --wait ctrl+period
<span class="k">omabox</span> <span class="g">check point</span> popup-menu</pre></div>

      <script>
        info.burst(document.getElementById("b4-n"), "#ffd60a", 18, 0.8);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#b4-head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0);
        const T = [0.3, 3.8, 7.8, 11.3], OUT = [3.75, 7.75, 11.25];
        const C = ["#b4-c1", "#b4-wall", "#b4-c3", "#b4-c4"];
        T.forEach((t, i) => {
          const u = `#b4-u${i + 1}`;
          tl.fromTo(u, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t + 0.1);
          if (i !== 1) tl.fromTo(C[i], { opacity: 0, x: 900 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
          if (i < 3) {
            tl.to(C[i], { opacity: 0, x: -900, duration: 0.4, ease: "power3.in" }, OUT[i]);
            tl.to(u, { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, OUT[i]);
          }
        });
        // The wall: the screens tile in, then the sticker.
        tl.fromTo("#b4-wall .cell", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.045 }, 3.85);
        tl.fromTo("#b4-n", { opacity: 0, scale: 0, rotation: -90 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.35, ease: "back.out(2.2)" }, 5.3);
        tl.to("#b4-n", { opacity: 0, duration: 0.2 }, 7.7);
        // The check: its lines, the two shots, then the brackets on what moved.
        tl.fromTo(["#b4-q1", "#b4-q2"], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.2 }, 8.1);
        tl.fromTo(["#b4-f1", "#b4-f2"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.15 }, 8.4);
        tl.fromTo(".brk", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 9.1);
        tl.fromTo("#b4-q3", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 9.4);
        tl.to("#b4-brk2", { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 9.8);
        // The tokens: the tree's answer, then text against a screenshot on one scale.
        ["#b4-m1", "#b4-m2", "#b4-m3"].forEach((m, i) => tl.to(m, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.2, ease: "power2.out" }, 11.6 + i * 0.15));
        tl.fromTo("#b4-r1 .lab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.1);
        tl.fromTo("#b4-b1", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 12.15);
        tl.fromTo("#b4-v1", { opacity: 0, scale: 1.6, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 12.2);
        tl.fromTo(["#b4-r2 .lab", "#b4-thumb"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.7);
        tl.fromTo("#b4-v2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 12.8);
        tl.fromTo("#b4-b2", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power2.out" }, 12.8);
        const n = { v: 0 }, num = document.getElementById("b4-num");
        tl.fromTo(n, { v: 0 }, { v: 1500, duration: 1.1, ease: "power2.out",
          onUpdate: () => { num.textContent = (Math.round(n.v / 10) * 10).toLocaleString("en-US"); } }, 12.8);
        tl.fromTo("#b4-glow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 14.0);
        tl.to("#b4-v1", { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 14.05);
        tl.to("#b4-root", { opacity: 0, duration: 0.25, ease: "power2.in" }, 14.75);
        window.__timelines["b4"] = tl;
      </script>

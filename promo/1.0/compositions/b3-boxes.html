<!doctype html>
<html>
  <body>
    <template>
      <style>
        #b3-root { position: absolute; inset: 0; }
        .bx { position: absolute; width: calc(420 * var(--u)); height: calc(236 * var(--u)); overflow: hidden;
          border-radius: calc(14 * var(--u)); box-shadow: 0 calc(20 * var(--u)) calc(50 * var(--u)) rgba(0,0,0,0.5), 0 0 0 2px var(--edge); }
        .bx .chip { left: calc(10 * var(--u)); bottom: calc(10 * var(--u)); font-size: calc(24 * var(--u)); color: var(--accent); letter-spacing: 0.02em; }
        .band { position: absolute; left: 0; right: 0; bottom: 0; height: calc(330 * var(--u));
          background: linear-gradient(to bottom, rgba(22,22,30,0) 0%, rgba(22,22,30,0.92) 45%, rgba(22,22,30,0.97) 100%); }
        #b3-say1 { bottom: calc(70 * var(--u)); font-size: calc(64 * var(--u)); }
        #b3-lost { left: calc(1380 * var(--u)); top: calc(560 * var(--u)); width: calc(330 * var(--u)); height: calc(330 * var(--u)); }
        #b3-lost .t { font-size: calc(54 * var(--u)); color: #000; }
        #b3-four { top: calc(705 * var(--u)); font-size: calc(68 * var(--u)); width: calc(1000 * var(--u)); }
        #b3-four .ok { color: var(--good); }
        #b3-post { position: absolute; left: calc(1110 * var(--u)); top: calc(690 * var(--u)); width: calc(750 * var(--u)); padding: calc(26 * var(--u)) calc(32 * var(--u));
          border-radius: calc(18 * var(--u)); background: #fff; color: #0f1419; box-shadow: calc(10 * var(--u)) calc(10 * var(--u)) 0 #000; }
        .who { display: flex; align-items: center; gap: calc(16 * var(--u)); }
        .av { width: calc(60 * var(--u)); height: calc(60 * var(--u)); border-radius: 50%; background: #cfd9de; position: relative; overflow: hidden; }
        .av i { position: absolute; left: 30%; top: 18%; width: 40%; height: 40%; border-radius: 50%; background: #8b98a5; }
        .av b { position: absolute; left: 14%; top: 62%; width: 72%; height: 60%; border-radius: 50%; background: #8b98a5; }
        .who .nm { font-family: Montserrat, sans-serif; font-weight: 900; font-size: calc(28 * var(--u)); }
        .who .hd { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(24 * var(--u)); color: #536471; }
        .txt { font-family: Montserrat, sans-serif; font-weight: 800; font-size: calc(40 * var(--u)); line-height: 1.25; margin-top: calc(16 * var(--u)); }
      </style>
      <!-- Act C: hands off your desktop. The same desktop and sentence, typed straight through while the
           agent works in a box; then the four agents' boxes, their list, and a user's word. -->
      <div id="b3-root" data-composition-id="b3" data-width="1920" data-height="1080">
        <div id="b3-desk" class="full"><div id="b3-z" class="zoom" data-layout-allow-overflow>
          <!-- desk-boxed: typing from 3.06 s; the agent's ls at 17.64 s. Two pieces, cut where the
               desktop shrinks. -->
          <video id="b3-va" src="assets/footage/desk-boxed.mp4" muted
                 data-start="0" data-duration="4.7" data-media-start="3.0" data-track-index="0"></video>
          <video id="b3-vb" src="assets/footage/desk-boxed.mp4" muted
                 data-start="4.7" data-duration="5.8" data-media-start="14.44" data-track-index="1"></video>
        </div></div>
        <div id="b3-chip" class="chip mono" style="right: calc(40 * var(--u)); top: calc(70 * var(--u)); color: var(--good)">YOUR DESKTOP</div>
        <div id="b3-chip2" class="chip mono" style="left: calc(70 * var(--u)); top: calc(600 * var(--u)); font-size: calc(24 * var(--u)); color: var(--good)">YOUR DESKTOP</div>
        <div id="b3-band" class="band"></div>
        <div id="b3-say1" class="pad display">Now the agent tests in a box of its own.</div>
        <div id="b3-lost" class="burst"><div class="t">Not one<br>key lost!</div></div>

        <div id="b3-b1" class="bx" style="left: calc(990 * var(--u)); top: calc(150 * var(--u))">
          <video id="b3-v1" src="assets/footage/box-omaseed-5cc72cdc.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="5.8" data-media-start="6.0" data-track-index="2"></video>
          <div class="chip mono">omaseed-5cc72cdc</div></div>
        <div id="b3-b2" class="bx" style="left: calc(1430 * var(--u)); top: calc(150 * var(--u))">
          <video id="b3-v2" src="assets/footage/box-add-sheet-9f01d2e4.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="5.8" data-media-start="7.0" data-track-index="3"></video>
          <div class="chip mono">add-sheet-9f01d2e4</div></div>
        <div id="b3-b3" class="bx" style="left: calc(990 * var(--u)); top: calc(406 * var(--u))">
          <video id="b3-v3" src="assets/footage/box-themes-7d20e815.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="5.8" data-media-start="8.0" data-track-index="4"></video>
          <div class="chip mono">themes-7d20e815</div></div>
        <div id="b3-b4" class="bx" style="left: calc(1430 * var(--u)); top: calc(406 * var(--u))">
          <video id="b3-v4" src="assets/footage/box-tray-icon-3b7a6c11.mp4" muted style="width: 100%; height: 100%"
                 data-start="4.7" data-duration="5.8" data-media-start="7.0" data-track-index="5"></video>
          <div class="chip mono">tray-icon-3b7a6c11</div></div>

        <div id="b3-four" class="pad display">
          <div>Four agents, four boxes.</div>
          <div class="ok">Nothing moves on yours.</div>
        </div>
        <div id="b3-post">
          <div class="who"><div class="av"><i></i><b></b></div><div><div class="nm">an omabox user</div><div class="hd">on X</div></div></div>
          <div class="txt">“0 AI-agent-induced rage incidents since install 😂”</div>
        </div>
      </div>
      <script>
        const FRAME = { srcW: 3840, srcH: 2160, cardW: 1920, cardH: 1080 };
        const aim = (s, sx, sy) => director.aim(s, sx, sy, FRAME);
        info.burst(document.getElementById("b3-lost"), "#ffd60a", 18, 0.8);
        const tl = gsap.timeline({ paused: true });
        tl.set("#b3-z", aim(1.06, 1100, 500), 0);
        tl.to("#b3-z", { ...aim(1, 1920, 1080), duration: 4.4, ease: "sine.inOut" }, 0.1);
        tl.fromTo("#b3-chip", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
        tl.fromTo("#b3-band", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
        tl.fromTo("#b3-say1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
        tl.fromTo("#b3-lost", { opacity: 0, scale: 0, rotation: -90 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.35, ease: "back.out(2.2)" }, 2.2);
        tl.to(["#b3-say1", "#b3-band", "#b3-chip", "#b3-lost"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.3);
        // The desktop steps aside; the four boxes fan in.
        tl.to("#b3-desk", { scale: 900 / 1920, x: 60, y: 150, borderRadius: 14, boxShadow: "0 0 0 2px #292e42", duration: 0.6, ease: "power3.inOut" }, 4.5);
        tl.fromTo("#b3-chip2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.0);
        tl.fromTo(["#b3-b1", "#b3-b2", "#b3-b3", "#b3-b4"], { opacity: 0, x: 140, rotation: 4 },
          { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 4.8);
        tl.fromTo("#b3-four > div", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.5 }, 5.4);
        // The agent's list: its box and the other three (ls at 17.64 s in the take = 7.9 s here).
        tl.to("#b3-z", { ...aim(1.9, 2750, 760), duration: 0.6, ease: "power3.inOut" }, 7.9);
        tl.fromTo("#b3-post", { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.35, ease: "back.out(1.8)" }, 7.2);
        tl.to("#b3-root", { opacity: 0, duration: 0.25, ease: "power2.in" }, 10.25);
        window.__timelines["b3"] = tl;
      </script>
    </template>
  </body>
</html>

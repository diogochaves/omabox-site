<!doctype html>
<html>
  <body>
    <template>
      <style>
        #b2-root { position: absolute; inset: 0; }
        #b2-intro { position: absolute; left: 0; right: 0; top: calc(150 * var(--u)); text-align: center; font-size: calc(70 * var(--u)); letter-spacing: 0.12em; }
        #b2-lock { position: absolute; left: 0; right: 0; top: calc(250 * var(--u)); height: calc(190 * var(--u));
          display: flex; align-items: center; justify-content: center; gap: calc(50 * var(--u)); }
        #b2-mark { position: relative; width: calc(180 * var(--u)); height: calc(180 * var(--u)); }
        #b2-word { font-size: calc(200 * var(--u)); }
        #b2-new { left: calc(1450 * var(--u)); top: calc(150 * var(--u)); width: calc(200 * var(--u)); height: calc(200 * var(--u)); }
        #b2-new .t { font-size: calc(44 * var(--u)); color: #fff; }
        #b2-new .t b { font-size: calc(64 * var(--u)); font-weight: 400; display: block; color: var(--tv-yellow); -webkit-text-stroke: calc(4 * var(--u)) #000; paint-order: stroke fill; }
        #b2-pitch { position: absolute; left: 0; right: 0; top: calc(560 * var(--u)); text-align: center; font-size: calc(78 * var(--u)); }
        #b2-p2 { color: var(--good); margin-top: calc(10 * var(--u)); }
        #b2-flash { position: absolute; inset: 0; background: #fff; transform-origin: 50% 50%; }
      </style>
      <!-- Act B: the turn. Colour snaps in: the mark, the name, a NEW! sticker, the pitch. -->
      <div id="b2-root" data-composition-id="b2" data-width="1920" data-height="1080">
        <div id="b2-lock">
          <div id="b2-mark" class="mark"></div>
          <div id="b2-word" class="wordmark">omabox</div>
        </div>
        <div id="b2-pitch" class="display">
          <div id="b2-p1">Your agents get desktops of their own.</div>
          <div id="b2-p2">Yours stays untouched.</div>
        </div>
        <div id="b2-flash"></div>
      </div>
      <script>
        const px = omaboxMark.draw(document.getElementById("b2-mark"), 12);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#b2-flash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0);
        tl.fromTo(px, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.4)", stagger: 0.025 }, 0.05);
        tl.fromTo("#b2-word", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.2);
        tl.fromTo("#b2-p1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.5);
        tl.fromTo("#b2-p2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.0);
        tl.to("#b2-root", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.8);
        window.__timelines["b2"] = tl;
      </script>
    </template>
  </body>
</html>
